name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: SDK — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        working-directory: packages/sdk

      - name: Tests
        run: npm test -w packages/sdk

      - name: Build
        run: npm run build -w packages/sdk

  build-playground:
    name: Playground — Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build SDK (playground dependency)
        run: npm run build -w packages/sdk

      - name: Build Playground
        run: npm run build -w apps/playground

  build-docs:
    name: Docs — Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build SDK (TypeDoc dependency)
        run: npm run build -w packages/sdk

      - name: Generate API Reference
        run: npm run docs:generate

      - name: Build Docs Site
        run: npm run build -w apps/docs
